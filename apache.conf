<VirtualHost *:80>
    # Utilisation de 127.0.0.1 pour éviter les problèmes de résolution de nom
    ServerName 127.0.0.1

    # DocumentRoot correct, pointe vers le répertoire public de Symfony
    DocumentRoot /var/www/safebase/public

    # Définir le fichier index à charger par défaut
    DirectoryIndex index.php

    # Réglages pour le répertoire public de Symfony
    <Directory /var/www/safebase/public>
        # Permettre les overrides via .htaccess
        AllowOverride All

        # Utilisation des directives modernes
        Require all granted

        # Rediriger toutes les requêtes vers index.php (utile pour Symfony)
        FallbackResource /index.php
    </Directory>

    # Log des erreurs et des accès
    ErrorLog /var/log/apache2/project_error.log
    CustomLog /var/log/apache2/project_access.log combined
</VirtualHost>
