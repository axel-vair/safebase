version: '3.8'

services:
  database:
    image: postgres:15.8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-potter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-user}
    ports:
      - '5460:5432'
    volumes:
      - shared-data:/var/www/var/dump

  backup:
    image: postgres:15.8
    environment:
      POSTGRES_DB: ${BACKUP_DB:-backup}
      POSTGRES_PASSWORD: ${BACKUP_PASSWORD:-password}
      POSTGRES_USER: ${BACKUP_USER:-user}
    ports:
      - '5459:5432'
    volumes:
      - shared-data:/var/www/var/dump

  adminer:
    image: adminer
    restart: always
    ports:
      - '29080:8080'

  apache-php:
    image: safebase-apache:latest
    container_name: safebase-apache-php
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      POTTER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      BACKUP_DATABASE_URL: postgresql://${BACKUP_USER}:${BACKUP_PASSWORD}@backup:5432/${BACKUP_DB}
    ports:
      - '9000:80'
    depends_on:
      - database
      - backup
    volumes:
      - shared-data:/var/www/var/dump

  init-db:
    image: safebase-apache:latest
    depends_on:
      - database
      - backup
    environment:
      APP_ENV: dev
      POTTER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      BACKUP_DATABASE_URL: postgresql://${BACKUP_USER}:${BACKUP_PASSWORD}@backup:5432/${BACKUP_DB}
    entrypoint: >
      sh -c "
        echo '⏳ Attente des bases de données...' &&
        sleep 5 &&
        php bin/console doctrine:database:create --if-not-exists --connection=default &&
        php bin/console doctrine:database:create --if-not-exists --connection=backup &&
        php bin/console doctrine:migrations:migrate --no-interaction &&
        php bin/console doctrine:fixtures:load --no-interaction
      "

volumes:
  shared-data:
